# Paste / merge into the nginx site that proxies https://dhansourcecapital.com/api
# (usually /etc/nginx/sites-available/dhansourcecapital.com or similar).
#
# WHY: Play Store app sends ALL loan docs in ONE multipart request.
# Default nginx client_max_body_size is 1m → connection reset → app shows "Network Error".

# Global (http or server block) — allow large loan multipart bodies
client_max_body_size 200m;
client_body_timeout 300s;
client_header_timeout 120s;

# API reverse-proxy location (adjust upstream port if needed)
location /api/ {
    proxy_pass http://127.0.0.1:5000;   # change if fin_backend uses another port
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Long uploads: phone → nginx → Node → S3
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Do not buffer entire multipart in nginx memory/disk before Node
    proxy_request_buffering off;
    proxy_buffering off;

    client_max_body_size 200m;
}

# Socket.IO reverse-proxy location for real-time mobile app & web admin events
location /socket.io/ {
    proxy_pass http://127.0.0.1:5000;   # change if fin_backend uses another port
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
